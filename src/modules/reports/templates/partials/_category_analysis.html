<section class="section">
  <h2 class="section-title">Category Analysis</h2>
  {% if report.category_chart %}
  <div class="donut-wrap">
    <svg viewBox="0 0 {{ report.category_chart.size }} {{ report.category_chart.size }}"
         width="100" height="100">
      {% for slice in report.category_chart.slices %}
      <path d="{{ slice.path }}" fill="{{ slice.color }}"></path>
      {% endfor %}
    </svg>
    <ul class="donut-legend">
      {% for slice in report.category_chart.slices %}
      <li>
        <span class="donut-legend-swatch" style="background: {{ slice.color }};"></span>
        <span class="donut-legend-label">{{ slice.label }}</span>
        <span class="donut-legend-pct">{{ "%.0f"|format(slice.percentage) }}%</span>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% else %}
    <p class="note">No expenses recorded for this period.</p>
  {% endif %}
</section>
