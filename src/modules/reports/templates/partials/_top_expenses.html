<section class="section">
  <h2 class="section-title">Top Expenses</h2>
  {% if report.top_expenses %}
  <table>
    <thead>
      <tr><th>Rank</th><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr>
    </thead>
    <tbody>
      {% for item in report.top_expenses %}
      <tr>
        <td><span class="rank-badge">{{ item.rank }}</span></td>
        <td>{{ item.date | fdate }}</td>
        <td>{{ item.description }}</td>
        <td>{{ item.category }}</td>
        <td>{{ item.amount | money }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
    <p class="note">No expenses recorded for this period.</p>
  {% endif %}
</section>
